[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheelio-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "python-multipart",
    "langchain",
    "langgraph",
    "langchain-openai",
    "Pillow>=10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
